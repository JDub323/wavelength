{% extends "base.html" %}
{% block title %}Sign up · Wavelength{% endblock %}
{% block content %}
<div class="auth">
  <h1>Create an account</h1>
  <form method="post" class="card">
    <label>Username <input name="username" value="{{ request.form.username }}" pattern="[A-Za-z0-9_]{3,30}"
                           title="3-30 letters, numbers or underscores" autocomplete="username" required autofocus></label>
    <label>Display name <input name="display_name" value="{{ request.form.display_name }}"></label>
    <label>Password <input name="password" type="password" minlength="6" autocomplete="new-password" required></label>
    <label>Confirm password <input name="confirm" type="password" minlength="6" autocomplete="new-password" required></label>
    <button class="btn" type="submit">Sign up</button>
  </form>
  <p class="muted">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
